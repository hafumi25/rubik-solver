<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate 3D Rubik's Cube Solver</title>
    <style>
        :root {
            --bg-color: #f2f4f7;
            --panel-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --primary-blue: #1a73e8;
            --primary-blue-hover: #1557b0;
            --btn-bg: #f1f3f4;
            --btn-hover: #e8eaed;
            --active-move: #1a73e8;
            --active-move-text: #fff;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 95vw;
            height: 90vh;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* LEFT PANEL - 3D VIEW */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #f8f9fa;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-blue);
            background: #e8f0fe;
        }

        .paint-tools {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--btn-bg);
            padding: 5px 10px;
            border-radius: 25px;
        }

        .paint-tools-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-right: 5px;
            font-weight: 500;
        }

        .color-swatch {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
        }

        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.active {
            border-color: var(--text-main);
            transform: scale(1.15);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.2);
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }

        /* RIGHT PANEL - CONTROLS */
        .right-panel {
            width: 420px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .action-btn:hover:not(:disabled) { background: var(--btn-bg); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .action-btn.solve-btn {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
            margin-top: 10px;
        }
        .action-btn.solve-btn:hover:not(:disabled) { background: var(--primary-blue-hover); }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus { border-color: var(--primary-blue); }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .control-btn:hover { background: var(--btn-bg); }
        .control-btn.primary {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
            width: 55px;
            height: 55px;
            border-radius: 14px;
        }
        .control-btn.primary:hover { background: var(--primary-blue-hover); }
        .control-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .slider-container {
            width: 100%;
            margin-bottom: 20px;
        }
        input[type="range"] { width: 100%; accent-color: var(--primary-blue); }

        .move-list-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .moves-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            min-height: 40px;
        }

        .move-badge {
            padding: 6px 10px;
            background: var(--btn-bg);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.3s;
            cursor: pointer;
        }

        .move-badge.active {
            background: var(--active-move);
            color: var(--active-move-text);
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
        }

        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-blue);
            z-index: 100;
            display: flex;
            backdrop-filter: blur(2px);
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e8f0fe;
            border-top-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <div class="top-bar">
            <div class="tab">3D Solver</div>
            <div class="paint-tools">
                <span class="paint-tools-label">Paint:</span>
                <div class="color-swatch" data-color="0xffffff" style="background: #ffffff;" title="White (Up)"></div>
                <div class="color-swatch" data-color="0xb71234" style="background: #b71234;" title="Red (Right)"></div>
                <div class="color-swatch" data-color="0x009b48" style="background: #009b48;" title="Green (Front)"></div>
                <div class="color-swatch" data-color="0xffd500" style="background: #ffd500;" title="Yellow (Down)"></div>
                <div class="color-swatch" data-color="0xff5800" style="background: #ff5800;" title="Orange (Left)"></div>
                <div class="color-swatch" data-color="0x0046ad" style="background: #0046ad;" title="Blue (Back)"></div>
            </div>
        </div>
        <div id="canvas-container">
            <div id="loading-overlay">
                <div class="spinner" id="loading-spinner"></div>
                <div id="loading-text">Loading Solver Library...<br><small style="font-weight:normal; font-size:12px; color:#666; margin-top:5px; display:block;">(Please wait)</small></div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="input-group">
            <input type="text" id="scramble-input" placeholder="Type custom scramble (e.g. R U R' F2)" autocomplete="off" disabled>
            <button class="action-btn" id="btn-custom-scramble" disabled>Apply Scramble</button>
        </div>

        <button class="action-btn" id="btn-random-scramble" disabled>
            🎲 Generate Random Scramble
        </button>

        <button class="action-btn solve-btn" id="btn-calculate" disabled>
            ⚡ Solve Current Cube State
        </button>

        <div class="move-list-title" id="move-count-text" style="margin-top:20px;">Solution:</div>
        <div class="moves-grid" id="moves-grid"></div>

        <div class="controls">
            <button class="control-btn" id="btn-play" title="Play Solution"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="control-btn" id="btn-pause" title="Pause"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
            <button class="control-btn" id="btn-stop" title="Reset to Start"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
            <button class="control-btn" id="btn-next" title="Next Move"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>

        <div class="slider-container">
            <input type="range" id="progress-slider" min="0" max="100" value="0">
        </div>

        <div class="guide-overlay" style="position:static; margin-top:auto; box-shadow:none; padding:0; background:transparent;">
            <h4 style="color:var(--text-main); margin-bottom:5px; font-size:14px;">How to use:</h4>
            <ol style="font-size:12px; color:var(--text-muted); margin-left:15px; line-height:1.6;">
                <li><b>Real Life:</b> Paint your cube with the colors at the top, then click Solve.</li>
                <li><b>Test It:</b> Generate a random scramble or type one in.</li>
                <li>Drag background to rotate view. Scroll to zoom.</li>
            </ol>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- LOAD BOTH THE CUBE STATE AND THE SOLVER ENGINE -->
<script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.min.js"></script>

<script>
    // ==========================================
    // 1. SETUP & CONSTANTS
    // ==========================================
    const COLORS = { U: 0xffffff, D: 0xffd500, F: 0x009b48, B: 0x0046ad, R: 0xb71234, L: 0xff5800 };
    const HEX_TO_FACE = {};
    for (let key in COLORS) { HEX_TO_FACE[COLORS[key]] = key; }

    let activeColor = null; 
    let isSolverReady = false;
    const container = document.getElementById('canvas-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const loadingSpinner = document.getElementById('loading-spinner');

    // Wait for ALL scripts to finish loading before initializing
    window.addEventListener('load', () => {
        if (typeof Cube === 'undefined' || typeof Cube.initSolver !== 'function') {
            loadingText.innerHTML = `❌ Failed to load Solver Engine.<br><small style="color:red">Check internet connection and refresh.</small>`;
            loadingSpinner.style.display = 'none';
            return;
        }

        loadingText.innerHTML = `Compiling Tables...<br><small style="font-weight:normal; font-size:12px; color:#666; margin-top:5px; display:block;">(The screen may freeze for 2 seconds)</small>`;
        
        // Use setTimeout to allow the UI to paint the loading text before the CPU locks up
        setTimeout(() => {
            try {
                Cube.initSolver();
                isSolverReady = true;
                loadingOverlay.style.display = 'none';
                
                // Enable UI buttons now that the solver is ready
                document.getElementById('scramble-input').disabled = false;
                document.getElementById('btn-custom-scramble').disabled = false;
                document.getElementById('btn-random-scramble').disabled = false;
                document.getElementById('btn-calculate').disabled = false;
                
            } catch (e) {
                loadingText.innerHTML = `❌ Error: ${e.message || e}`;
                console.error(e);
            }
        }, 100);
    });

    // ==========================================
    // 2. THREE.JS SETUP
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f8f9fa');

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(5, 5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 5;
    controls.maxDistance = 15;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight1.position.set(10, 20, 10);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight2.position.set(-10, -20, -10);
    scene.add(dirLight2);

    // ==========================================
    // 3. CUBE GEOMETRY
    // ==========================================
    const cubies = [];
    const cubieSize = 0.95;
    const gap = 0.05;
    const offset = cubieSize + gap;
    const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

    function createCube() {
        cubies.forEach(c => scene.remove(c));
        cubies.length = 0;
        const geometry = new THREE.BoxGeometry(cubieSize, cubieSize, cubieSize);
        
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    if (x === 0 && y === 0 && z === 0) continue;
                    const materials = [
                        x === 1 ? new THREE.MeshStandardMaterial({ color: COLORS.R, roughness: 0.2 }) : matBlack.clone(),
                        x === -1 ? new THREE.MeshStandardMaterial({ color: COLORS.L, roughness: 0.2 }) : matBlack.clone(),
                        y === 1 ? new THREE.MeshStandardMaterial({ color: COLORS.U, roughness: 0.2 }) : matBlack.clone(),
                        y === -1 ? new THREE.MeshStandardMaterial({ color: COLORS.D, roughness: 0.2 }) : matBlack.clone(),
                        z === 1 ? new THREE.MeshStandardMaterial({ color: COLORS.F, roughness: 0.2 }) : matBlack.clone(),
                        z === -1 ? new THREE.MeshStandardMaterial({ color: COLORS.B, roughness: 0.2 }) : matBlack.clone()
                    ];
                    const cubie = new THREE.Mesh(geometry, materials);
                    cubie.position.set(x * offset, y * offset, z * offset);
                    const edges = new THREE.EdgesGeometry(geometry);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                    cubie.add(line);
                    scene.add(cubie);
                    cubies.push(cubie);
                }
            }
        }
    }
    createCube();

    // ==========================================
    // 4. PAINTING LOGIC
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            e.target.classList.add('active');
            activeColor = parseInt(e.target.getAttribute('data-color'));
        });
    });

    let pointerDownPos = { x: 0, y: 0 };
    container.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
    });

    container.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist > 5 || !activeColor) return;

        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cubies);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            intersect.object.material[intersect.face.materialIndex].color.setHex(activeColor);
            stopPlayback();
            solutionMoves = [];
            renderMoveList();
        }
    });

    // ==========================================
    // 5. ROTATION ENGINE
    // ==========================================
    let isAnimating = false;
    const moveQueue = [];
    const FACES = {
        'R': { axis: 'x', value: 1, dir: -1 }, 'L': { axis: 'x', value: -1, dir: 1 },
        'U': { axis: 'y', value: 1, dir: -1 }, 'D': { axis: 'y', value: -1, dir: 1 },
        'F': { axis: 'z', value: 1, dir: -1 }, 'B': { axis: 'z', value: -1, dir: 1 }
    };

    function rotateFace(move, callback) {
        if (isAnimating) return;
        isAnimating = true;

        const face = move[0];
        const modifier = move.length > 1 ? move[1] : '';
        const faceData = FACES[face];
        
        let angle = (Math.PI / 2) * faceData.dir;
        if (modifier === "'") angle *= -1;
        if (modifier === '2') angle *= 2;

        const layerCubies = cubies.filter(c => Math.round(c.position[faceData.axis] / offset) === faceData.value);
        const pivot = new THREE.Group();
        scene.add(pivot);
        layerCubies.forEach(c => pivot.attach(c));

        const duration = 150;
        const startTime = performance.now();

        function animateRotation(time) {
            let progress = Math.min((time - startTime) / duration, 1);
            progress = 1 - (1 - progress) * (1 - progress);
            const currentAngle = angle * progress;
            
            if (faceData.axis === 'x') pivot.rotation.x = currentAngle;
            if (faceData.axis === 'y') pivot.rotation.y = currentAngle;
            if (faceData.axis === 'z') pivot.rotation.z = currentAngle;

            if (progress < 1) {
                requestAnimationFrame(animateRotation);
            } else {
                if (faceData.axis === 'x') pivot.rotation.x = angle;
                if (faceData.axis === 'y') pivot.rotation.y = angle;
                if (faceData.axis === 'z') pivot.rotation.z = angle;

                pivot.updateMatrixWorld();
                layerCubies.forEach(c => {
                    scene.attach(c);
                    c.position.x = Math.round(c.position.x / offset) * offset;
                    c.position.y = Math.round(c.position.y / offset) * offset;
                    c.position.z = Math.round(c.position.z / offset) * offset;
                    
                    const euler = new THREE.Euler().setFromQuaternion(c.quaternion);
                    const snap = Math.PI / 2;
                    euler.x = Math.round(euler.x / snap) * snap;
                    euler.y = Math.round(euler.y / snap) * snap;
                    euler.z = Math.round(euler.z / snap) * snap;
                    c.quaternion.setFromEuler(euler);
                });
                scene.remove(pivot);
                
                isAnimating = false;
                if (callback) callback();
                processQueue();
            }
        }
        requestAnimationFrame(animateRotation);
    }

    function processQueue() {
        if (moveQueue.length === 0 || isAnimating) return;
        const nextMove = moveQueue.shift();
        rotateFace(nextMove.move, nextMove.callback);
    }

    function executeMove(move, callback) {
        moveQueue.push({ move, callback });
        if (!isAnimating && moveQueue.length === 1) processQueue();
    }

    // ==========================================
    // 6. STATE EXTRACTION
    // ==========================================
    function getColorAtPosition(x, y, z, nx, ny, nz) {
        const cubie = cubies.find(c => 
            Math.round(c.position.x / offset) === x &&
            Math.round(c.position.y / offset) === y &&
            Math.round(c.position.z / offset) === z
        );
        if (!cubie) return 'U'; 

        const localNormals = [
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
            new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
            new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
        ];

        const targetNormal = new THREE.Vector3(nx, ny, nz);

        for (let i = 0; i < 6; i++) {
            const worldNormal = localNormals[i].clone().applyQuaternion(cubie.quaternion);
            worldNormal.x = Math.round(worldNormal.x);
            worldNormal.y = Math.round(worldNormal.y);
            worldNormal.z = Math.round(worldNormal.z);
            
            if (worldNormal.equals(targetNormal)) {
                const hex = cubie.material[i].color.getHex();
                return HEX_TO_FACE[hex] || 'U';
            }
        }
        return 'U';
    }

    function getFaceletString() {
        let facelets = "";
        for (let z = -1; z <= 1; z++) for (let x = -1; x <= 1; x++) facelets += getColorAtPosition(x, 1, z, 0, 1, 0);
        for (let y = 1; y >= -1; y--) for (let z = 1; z >= -1; z--) facelets += getColorAtPosition(1, y, z, 1, 0, 0);
        for (let y = 1; y >= -1; y--) for (let x = -1; x <= 1; x++) facelets += getColorAtPosition(x, y, 1, 0, 0, 1);
        for (let z = 1; z >= -1; z--) for (let x = -1; x <= 1; x++) facelets += getColorAtPosition(x, -1, z, 0, -1, 0);
        for (let y = 1; y >= -1; y--) for (let z = -1; z <= 1; z++) facelets += getColorAtPosition(-1, y, z, -1, 0, 0);
        for (let y = 1; y >= -1; y--) for (let x = 1; x >= -1; x--) facelets += getColorAtPosition(x, y, -1, 0, 0, -1);
        return facelets;
    }

    // ==========================================
    // 7. UI ACTIONS
    // ==========================================
    document.getElementById('btn-calculate').onclick = () => {
        if (!isSolverReady) return;
        loadingText.textContent = "Calculating Solution...";
        loadingSpinner.style.display = 'block';
        loadingOverlay.style.display = 'flex';
        
        setTimeout(() => {
            try {
                const faceletString = getFaceletString();
                const cube = Cube.fromString(faceletString);
                const solutionString = cube.solve();
                
                if (solutionString) {
                    solutionMoves = solutionString.trim().split(/\s+/);
                    currentMoveIndex = 0;
                    renderMoveList();
                    isPlaying = true;
                    playNextMove();
                } else {
                    alert("This cube state is invalid or unsolvable. Please check your colors.");
                }
            } catch (e) {
                console.error(e);
                alert("Error solving cube. Make sure you have exactly 9 of each color and standard centers.");
            }
            loadingOverlay.style.display = 'none';
        }, 50);
    };

    document.getElementById('btn-random-scramble').onclick = () => {
        stopPlayback();
        solutionMoves = [];
        renderMoveList();
        const faces = ['R', 'L', 'U', 'D', 'F', 'B'];
        const modifiers = ['', "'", '2'];
        const scramble = [];
        for (let i = 0; i < 20; i++) {
            const face = faces[Math.floor(Math.random() * faces.length)];
            if (scramble.length > 0 && scramble[scramble.length - 1][0] === face) { i--; continue; }
            const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
            scramble.push(face + mod);
        }
        let scrambleIndex = 0;
        function applyScramble() {
            if (scrambleIndex < scramble.length) {
                executeMove(scramble[scrambleIndex], () => { scrambleIndex++; applyScramble(); });
            } else {
                document.getElementById('btn-calculate').click();
            }
        }
        applyScramble();
    };

    document.getElementById('btn-custom-scramble').onclick = () => {
        const val = document.getElementById('scramble-input').value.trim().toUpperCase();
        if (!val) return;
        const moves = val.split(/\s+/);
        const validMoves = [];
        const regex = /^[RLUDFB](\'|2)?$/;
        for (let m of moves) {
            if (regex.test(m)) validMoves.push(m);
            else { alert(`Invalid move: ${m}`); return; }
        }
        stopPlayback();
        solutionMoves = [];
        renderMoveList();
        let idx = 0;
        function applyScramble() {
            if (idx < validMoves.length) {
                executeMove(validMoves[idx], () => { idx++; applyScramble(); });
            } else {
                document.getElementById('btn-calculate').click();
            }
        }
        applyScramble();
    };

    // ==========================================
    // 8. PLAYBACK LOGIC
    // ==========================================
    let solutionMoves = [];
    let currentMoveIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    
    const movesGrid = document.getElementById('moves-grid');
    const moveCountText = document.getElementById('move-count-text');
    const slider = document.getElementById('progress-slider');

    function renderMoveList() {
        movesGrid.innerHTML = '';
        moveCountText.textContent = solutionMoves.length > 0 ? `Solution (${solutionMoves.length} moves):` : "Solution:";
        solutionMoves.forEach((move, index) => {
            const badge = document.createElement('div');
            badge.className = `move-badge ${index === currentMoveIndex ? 'active' : ''}`;
            badge.textContent = move;
            movesGrid.appendChild(badge);
        });
        slider.max = solutionMoves.length;
        slider.value = currentMoveIndex;
    }

    function updateUIState() {
        const badges = movesGrid.children;
        for (let i = 0; i < badges.length; i++) {
            if (i === currentMoveIndex) {
                badges[i].classList.add('active');
                badges[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                badges[i].classList.remove('active');
            }
        }
        slider.value = currentMoveIndex;
    }

    function playNextMove() {
        if (currentMoveIndex >= solutionMoves.length) {
            stopPlayback(); return;
        }
        const move = solutionMoves[currentMoveIndex];
        executeMove(move, () => {
            currentMoveIndex++;
            updateUIState();
            if (isPlaying) playInterval = setTimeout(playNextMove, 250);
        });
    }

    document.getElementById('btn-play').onclick = () => {
        if (isPlaying || currentMoveIndex >= solutionMoves.length) return;
        isPlaying = true;
        playNextMove();
    };

    function stopPlayback() {
        isPlaying = false;
        clearTimeout(playInterval);
    }

    document.getElementById('btn-pause').onclick = stopPlayback;
    document.getElementById('btn-stop').onclick = () => { stopPlayback(); window.location.reload(); };
    document.getElementById('btn-next').onclick = () => {
        stopPlayback();
        if (currentMoveIndex < solutionMoves.length) {
            executeMove(solutionMoves[currentMoveIndex], () => {
                currentMoveIndex++; updateUIState();
            });
        }
    };

    // ==========================================
    // 9. RENDER LOOP
    // ==========================================
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
